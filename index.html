    <style>
        /* إزالة الهوامش وجعل الصفحة تملأ الشاشة بالكامل */

            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
