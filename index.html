<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة المباراة</title>
    <style>
        /* إزالة الهوامش الافتراضية وجعل الصفحة تملأ الشاشة بالكامل */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* لمنع ظهور شريط التمرير */
            background-color: #000; /* خلفية سوداء للشاشة */
        }

        /* جعل الـ iframe يملأ الشاشة تماماً */
        .video-container {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

            frameborder="0" 
            allowfullscreen 
            scrolling="no"
            sandbox="allow-scripts allow-same-origin allow-presentation">

    </div>

</body>
</html>
